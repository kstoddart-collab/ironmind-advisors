<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Message received · Kenny Stoddart</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --void: #0a0a0c;
    --bone: #f4f1ec;
    --bone-soft: rgba(244,241,236,0.72);
    --bone-mute: rgba(244,241,236,0.46);
    --ox: #1872b0;
    --ember: #3f95d4;
    --rule: rgba(244,241,236,0.10);
  }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--void);
    color: var(--bone);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(40px, 8vw, 96px) clamp(22px, 5vw, 48px);
    text-align: center;
    background:
      radial-gradient(ellipse 60% 50% at 50% 30%, rgba(24,114,176,0.16), transparent 60%);
  }
  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ox);
    display: inline-flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 22px;
  }
  .eyebrow::before { content: ''; width: 28px; height: 1.5px; background: var(--ox); }
  h1 {
    font-size: clamp(34px, 5.2vw, 60px);
    font-weight: 900;
    letter-spacing: -0.035em;
    line-height: 1.02;
    margin-bottom: 18px;
  }
  p {
    color: var(--bone-soft);
    font-size: clamp(17px, 1.8vw, 20px);
    line-height: 1.55;
    max-width: 520px;
    margin: 0 auto 40px;
  }
  .btn-primary {
    display: inline-block;
    padding: 17px 32px;
    background: var(--ox);
    color: var(--bone);
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: background 0.2s ease;
  }
  .btn-primary:hover { background: var(--ember); }
  footer {
    padding: 20px 0;
    color: var(--bone-mute);
    font-size: 12px;
    text-align: center;
    letter-spacing: 0.06em;
    border-top: 1px solid var(--rule);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="eyebrow">Booking inquiry</div>
      <h1>Message <span style="color: var(--ox);">received.</span></h1>
      <p>Kenny reads every one himself and replies inside 24 hours.</p>
      <a href="/" class="btn-primary">Back to home</a>
    </div>
  </div>
  <footer>© 2026 IronMind Advisors · Confidential by design</footer>
</body>
</html>
